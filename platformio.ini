; PlatformIO Project Configuration File
;
; Tesis: Sistema IoT-WSN y CCTV - Subsistema Estructural
; Autores: Gerardo Rabanal y Gilmar Vargas
; Simulación en Wokwi para validación de firmware
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerías para subsistema estructural
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit ADXL345@^1.3.1
    bogde/HX711@^0.7.5
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.7
